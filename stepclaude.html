/* Layout: left rail (desktop) / bottom tab bar (phone). Today = one dial hero + live stats, then goals, timeline. Dark navy first, lime for the dial only. */
:root{

  --nav-h:64px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#eaeefb; --line:#d9dff0;
  --fg:#0d1431; --muted:#576088; --accent:#b9e92a; --accent-ink:#4a6b00; --on-accent:#0d1431;
  --blue:#2f5fe8; --violet:#6c4fe0; --warn:#a85f00; --bad:#c42a43; --good:#0a7d4b;
  --shadow:0 8px 24px rgba(20,30,70,.10); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#eaeefb; --line:#d9dff0;
  --fg:#0d1431; --muted:#576088; --accent:#b9e92a; --accent-ink:#4a6b00; --on-accent:#0d1431;
  --blue:#2f5fe8; --violet:#6c4fe0; --warn:#a85f00; --bad:#c42a43; --good:#0a7d4b;
  --shadow:0 8px 24px rgba(20,30,70,.10); color-scheme:light}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--display);letter-spacing:-.02em;padding:0 8px}
.brand i{width:28px;height:28px;border-radius:50%;border:5px solid var(--accent);border-right-color:transparent;transform:rotate(-30deg);display:block}

.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface2);color:var(--fg)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font:700 clamp(26px,4vw,38px)/1.1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.top p{color:var(--muted);margin-top:4px}

.sub{color:var(--muted);font-size:13px}

.between{justify-content:space-between}

.src-motion{background:var(--accent)} .src-import{background:var(--blue)} .src-manual{background:var(--violet)}

.note:first-child{border-top:0}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
form.grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input[type=number],input[type=text],input[type=date],input[type=time],select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%;color:var(--fg)}
input:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;min-height:18px}
.ok{color:var(--good);font-size:13px}

.c-motion{fill:var(--accent)} .c-import{fill:var(--blue)} .c-manual{fill:var(--violet)} .c-goal{fill:var(--good)}

.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}

.scroll-x{overflow-x:auto}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.onb{border-color:var(--accent-ink)}
.steps-dots{display:flex;gap:6px;margin:10px 0 14px}

.skel{animation:pulse 1.2s infinite alternate;background:var(--surface2);border-radius:10px;height:16px}
@keyframes pulse{to{opacity:.4}}
.tabbar{display:none}
@media (max-width:860px){

  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}

</style>

}

  '<section class="card"><h2>Goal completion</h2><p class="sub">Days you reached '+fmt(S.goals.steps)+' steps, per week</p><div style="margin-top:12px">'+(c.keys.length?barChart(gw,{order:['goal'],unit:'days',label:'Goal days per week',goal:S.goals.activeDays}):'<div class="empty"><b>No weeks to show</b><span>Goal completion appears once you log activity.</span></div>')+'</div><p class="sub" style="margin-top:8px">Dashed line is your weekly target of '+S.goals.activeDays+' days.</p></section></div>';

function addRecord(o){
  var c0=ctx(),before=c0.td.steps,g=S.goals.steps;
  S.records.push(o);S.lastUpdate=Date.now();save();
  var after=ctx().td.steps;
  if(o.date===today()){
    if(before<g&&after>=g){toast('Goal reached. Nice work.');if(S.prefs.celebrate)confetti()}
    else{var m=[75,50,25].filter(function(x){return before<g*x/100&&after>=g*x/100})[0];if(m&&S.prefs.encourage)toast(m+'% of your daily goal done')}
  }
}
function submitAdd(){
  var steps=+$('#f-steps').value,date=$('#f-date').value,time=$('#f-time').value||'12:00',w=$('#f-walk').value,r=$('#f-run').value,err='';
  if(!Number.isInteger(steps)||steps<1||steps>100000)err='Enter steps as a whole number between 1 and 100,000.';
  else if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today())err='Choose a date that is today or earlier.';
  else if(date===today()&&time>pad(new Date().getHours())+':'+pad(new Date().getMinutes()))err='That time is in the future. Pick a time that has already passed.';
  else if((w&&(+w<0||+w>600))||(r&&(+r<0||+r>600)))err='Minutes must be between 0 and 600.';
  if(err){formMsg={t:'err',m:err};$('#formMsg').className='err';$('#formMsg').textContent=err;return}
  var hh=+time.slice(0,2),mm=+time.slice(3,5),run=r?+r:0,walk=w?+w:Math.max(1,Math.round(steps/110)-run),d=parse(date);
  addRecord({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:date,hour:hh,min:mm,steps:steps,walk:walk,run:run,source:'manual',ts:new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm).getTime()});
  formMsg={t:'ok',m:'Added '+fmt(steps)+' steps as Manual.'};render();
}
function csvEscape(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportData(kind){
  var msg=$('#exportMsg');
  if(!S.records.length&&kind==='csv'){msg.textContent='There are no saved entries to export yet. Preview data is not exported.';return}
  var data,name;
  if(kind==='csv'){data='date,time,steps,walk_min,run_min,source\n'+S.records.map(function(r){return [r.date,timeLabel(r),r.steps,r.walk,r.run,r.source].map(csvEscape).join(',')}).join('\n');name='stepsync-activity.csv'}
  else{data=JSON.stringify({exportedAt:new Date().toISOString(),profile:S.profile,goals:S.goals,preferences:S.prefs,records:S.records},null,2);name='stepsync-export.json'}
  claude.use('downloads').then(function(dl){
    if(!dl){msg.textContent='Saving files is not available in this view. Open the page in claude.ai to export.';return}
    return dl.save({filename:name,data:data}).then(function(){msg.textContent='Saved '+name+'.'}).catch(function(e){msg.textContent=e&&e.code==='declined'?'Export cancelled.':'Could not save the file. Try again.'})
  }).catch(function(){msg.textContent='Saving files is not available in this view.'});
}
function importCSV(file){
  if(!file)return;
  if(file.size>2e6){importMsg='That file is over 2 MB. Split it and try again.';render();return}
  var fr=new FileReader();
  fr.onerror=function(){importMsg='Could not read that file.';render()};
  fr.onload=function(){
    var lines=String(fr.result).split(/\r?\n/).filter(function(x){return x.trim()}),head=lines.shift();
    if(!head){importMsg='The file is empty.';render();return}
    var cols=head.split(',').map(function(x){return x.trim().toLowerCase()}),ix=function(n){return cols.indexOf(n)};
    if(ix('date')<0||ix('steps')<0){importMsg='Add a header row with at least "date" and "steps" columns.';render();return}
    var ok=0,bad=0,add=[];
    lines.slice(0,5000).forEach(function(l){
      var f=l.split(',').map(function(x){return x.trim().replace(/^"|"$/g,'')}),date=f[ix('date')],steps=Math.round(+f[ix('steps')]),tm=ix('time')>=0&&/^\d{1,2}:\d{2}$/.test(f[ix('time')]||'')?f[ix('time')]:'12:00';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')||date>today()||!(steps>0&&steps<=100000)){bad++;return}
      var hh=+tm.split(':')[0],mm=+tm.split(':')[1];if(hh>23||mm>59){bad++;return}
      var run=ix('run_min')>=0?Math.max(0,+f[ix('run_min')]||0):0,walk=ix('walk_min')>=0&&f[ix('walk_min')]!==''?Math.max(0,+f[ix('walk_min')]||0):Math.max(1,Math.round(steps/110)-run),d=parse(date);
      add.push({id:'i'+Date.now().toString(36)+ok+Math.random().toString(36).slice(2,4),date:date,hour:hh,min:mm,steps:steps,walk:walk,run:run,source:'import',ts:new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm).getTime()});ok++;
    });
    S.records=S.records.concat(add);if(ok){S.lastUpdate=Date.now();save()}
    importMsg=ok?('Imported '+ok+' rows as Imported'+(bad?'. Skipped '+bad+' with invalid dates or steps.':'.')):'No rows were imported. Dates must look like 2026-10-19 and steps must be numbers.';render();
  };
  fr.readAsText(file);
}
/* experimental browser motion counter */
function stopMotion(save_){
  var m=motion;if(!m)return;window.removeEventListener('devicemotion',m.fn);clearTimeout(m.to);
  var n=m.count;
  if(m.state==='running'&&save_&&n>0){var d=new Date();addRecord({id:'s'+Date.now().toString(36),date:today(),hour:d.getHours(),min:d.getMinutes(),steps:n,walk:Math.max(1,Math.round(n/110)),run:0,source:'motion',ts:Date.now()});motion={state:'idle',ok:true,msg:'Saved '+n+' steps as Measured (browser motion, experimental).'}}
  else motion=m.msg&&m.state==='idle'?m:{state:'idle',ok:false,msg:n?'':'Stopped. No steps were counted.'};
  render();
}
function startMotion(){
  if(!('DeviceMotionEvent' in window)){motion={state:'idle',ok:false,msg:'This browser does not support motion sensors, so nothing can be measured here.'};render();return}
  var begin=function(){
    var m={state:'running',count:0,lp:9.8,last:0,got:false,prev:0};motion=m;
    m.fn=function(e){
      var a=e.accelerationIncludingGravity;if(!a||a.x==null)return;m.got=true;
      var mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);m.lp=m.lp*.98+mag*.02;var hp=mag-m.lp,now=Date.now();
      if(m.prev<=1.6&&hp>1.6&&now-m.last>330){m.count++;m.last=now;var el=$('#mCount');if(el)el.firstChild.nodeValue=m.count}
      m.prev=hp;
    };
    window.addEventListener('devicemotion',m.fn);
    m.to=setTimeout(function(){if(!m.got){window.removeEventListener('devicemotion',m.fn);motion={state:'idle',ok:false,msg:'No motion data arrived. This device, browser or the frame this page runs in is blocking the sensor, so nothing was recorded.'};render()}},2500);
    render();
  };
  try{
    if(typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(function(r){if(r==='granted')begin();else{motion={state:'idle',ok:false,msg:'Motion permission was denied. Allow it in your browser settings to try again.'};render()}}).catch(function(){motion={state:'idle',ok:false,msg:'Motion permission could not be requested here.'};render()})}
    else begin();
  }catch(e){motion={state:'idle',ok:false,msg:'Motion sensors are unavailable in this view.'};render()}
}
function setNum(id,key,obj,min,max,int){
  var el=$('#'+id),v=+el.value;
  if(el.value===''||isNaN(v)||v<min||v>max){var e=$('#setErr');if(e)e.textContent='Enter a value between '+min+' and '+max+'.';return false}
  obj[key]=int?Math.round(v):v;save();var e2=$('#setErr');if(e2)e2.textContent='';return true;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-nav],[data-act],[data-period],[data-metric],[data-day],[data-month],[data-del],[data-theme-set],[data-bi]');if(!t)return;
  var D=t.dataset;
  if(D.nav)return go(D.nav);
  if(D.period){PER.period=D.period;return render()}
  if(D.metric){PER.metric=D.metric;return render()}
  if(D.bi!==undefined){var r=$('#readout');if(r)r.innerHTML=readoutText(+D.bi);return}
  if(D.day){calSel=D.day;return render()}
  if(D.month){var y=+calMonth.slice(0,4),m=+calMonth.slice(5)-1+ +D.month,d=new Date(y,m,1);calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);return render()}
  if(D.del){S.records=S.records.filter(function(r){return r.id!==D.del});save();toast('Entry deleted');return render()}
  if(D.themeSet){S.prefs.theme=D.themeSet;save();return render()}
  switch(D.act){
   case 'preview-off':S.preview=false;save();toast('Preview data hidden');return render();
   case 'preview-on':S.preview=true;save();return render();
   case 'onb-next':S.onboard.step=1;save();return render();
   case 'onb-skip':case 'onb-done':S.onboard.done=true;save();return render();
   case 'onb-empty':S.onboard.done=true;S.preview=false;save();return render();
   case 'onb-save':
     var h=+$('#o-h').value,w=+$('#o-w').value,g=+$('#o-g').value;
     if(!(h>=100&&h<=230)||!(w>=30&&w<=250)||!(g>=1000&&g<=50000)){$('#onbErr').textContent='Check your numbers: height 100 to 230 cm, weight 30 to 250 kg, goal 1,000 to 50,000 steps.';return}
     S.profile.name=$('#o-name').value.trim().slice(0,30);S.profile.height=h;S.profile.weight=w;S.goals.steps=Math.round(g);S.onboard.step=2;save();return render();
   case 'motion-start':return startMotion();
   case 'motion-stop':return stopMotion(true);
   case 'export-csv':return exportData('csv');
   case 'export-json':return exportData('json');
   case 'del-ask':confirmDel=true;return render();
   case 'del-cancel':confirmDel=false;return render();
   case 'del-confirm':S=DEFAULTS();S.preview=false;S.onboard.done=true;save();confirmDel=false;importMsg='';toast('All data deleted');return render();
  }
});
document.addEventListener('submit',function(e){if(e.target.id==='addForm'){e.preventDefault();submitAdd()}});
document.addEventListener('change',function(e){
  var id=e.target.id;if(!id)return;
  if(id==='importFile'){importCSV(e.target.files[0]);return}
  var done=false;
  if(id==='s-name'){S.profile.name=e.target.value.trim().slice(0,30);save();done=true}
  else if(id==='s-h')done=setNum(id,'height',S.profile,100,230);
  else if(id==='s-w')done=setNum(id,'weight',S.profile,30,250);
  else if(id==='s-stride')done=setNum(id,'stride',S.profile,30,150);
  else if(id==='s-custom'){S.profile.stride=e.target.checked?Math.round(strideCm()):null;save();done=true}
  else if(id==='s-goal')done=setNum(id,'steps',S.goals,1000,50000,true);
  else if(id==='s-days')done=setNum(id,'activeDays',S.goals,1,7,true);
  else if(id==='s-walk')done=setNum(id,'walk',S.goals,0,600,true);
  else if(id==='s-run')done=setNum(id,'run',S.goals,0,600,true);
  else if(id==='s-enc'){S.prefs.encourage=e.target.checked;save();done=true}
  else if(id==='s-cel'){S.prefs.celebrate=e.target.checked;save();done=true}
  else if(id==='s-prev'){S.preview=e.target.checked;save();done=true}
  if(done){if(id==='s-custom'||id==='s-prev')render();else toast('Saved')}
});
$('#themeBtn').addEventListener('click',function(){var o=['system','dark','light'];S.prefs.theme=o[(o.indexOf(S.prefs.theme)+1)%3];save();render();toast('Theme: '+S.prefs.theme)});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TITLES[h]&&h!==view){view=h;render()}});
document.addEventListener('visibilitychange',function(){var f=$('#f-steps');if(!document.hidden&&view==='today'&&!(motion&&motion.state==='running')&&(!f||!f.value))render()});
var h0=location.hash.slice(1);if(TITLES[h0])view=h0;
render();
})();
</script>
